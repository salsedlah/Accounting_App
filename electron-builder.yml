appId: com.hisab.accounting
productName: حساب
directories:
  output: dist
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: .next
    to: .
    filter:
      - "standalone/**/*"
asar: true
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  icon: electron/icon.png
portable:
  artifactName: Hisab-${version}-portable.exe
